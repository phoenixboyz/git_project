<!Doctype html>
<html>
  <body>
    <head>
      <title>
        CSS properties part 1
      </title>
      <link rel="stylesheet" href="./css-properties-style.css" />
    </head>
    
    <h3 id="text">This is an H1 text</h3>
    
    <div id="div_display" class="margin_spacing">
      <p id="div_display_text">Height,Width and Background color</p>
    </div>
    
    <div id="border_display" class="margin_spacing">
      <p id="border_display_text">Border styling</p>
    </div>
    
    <div id="padding_spacing">
      <p id="padding_spacing_text">Padding styling</p>
    </div>
    
    <p id="text_alignment">
      Text alignment
    </p>
    
    <p id="text_decoration_underline">Text decoration underline</p>
    
    <p class="text_decoration_line_through">Text decoration line through</p>

   <p id="new_price">New price: #30</p>
   
   <p id="text_decoration_overline">

   </p>
   
   <div id="display_element">
     <p>Display text</p>
   </div>
   
   <div class="border_radius_default" id="border_radius_1"></div>
   
   <div class="border_radius_default" id="border_radius_full_circle"></div>
