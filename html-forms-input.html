<!DOCTYPE html>
<html>
    <head>
        <title>HTML Forms Input</title>
    </head>
    <body>
        <form>
            <label>First Name:</label>

            <br />
            <input type="text" name="firstName" placeholder="Olawale" required />
            <br />

            <br />
            <label>Last Name:</label>
            <br />
            <input type="text" name="lastName" placeholder="Oyetoke" required />
            <br />

            <br />
            <label>Email:</label>
            <br />
            <input type="email" name="email" placeholder="example@gmail.com" required />
            <br />

            <br />
            <label>Password:</label>
            <br />
            <input type="password" name="password" placeholder="*********" required />
            <br />

            <br />
            <label>Date of birth:</label>
            <br />
            <input type="date" name="dateOfBirth" required />
            <br />


            <br />
            <label>if x(2) is 4 what is x?</label>
            <br />
            <input type="radio" name="gender" value="male" required />
            <label>2</label>
            <input type="radio" name="gender" value="female" required />
            <label>3</label>
            <br />

            <br/>
            <label>Country:</label>
            <br />

            <select name="country" required>
                <option value="nigeria">Nigeria</option>
                <option value="ghana">Ghana</option>
                <option value="kenya">Kenya</option>
                <option value="uganda">Uganda</option>
                <option value="tanzania">Tanzania</option>
                <option value="rwanda">Rwanda</option>
                <option value="burundi">Burundi</option>
                <option value="congo">Congo</option>
            </select>

            <br />
            <br />
            <label>Upload your profile picture:</label>
            <br />
            <input type="file" name="profilePicture" required />
            <br />

            <br />
            <br />
            <input type="checkbox" name="termsAndConditions" required />
            <label>I agree to the terms and conditions</label>
            <br />

            <br />
            <input type="checkbox" name="emailUpdates" required />
            <label>I want to receive email updates</label>
            <br />
            
            <br />
            <input type="range" name="age" required />
            <br />

            <br />
            <label>Bio:</label>
            <br />
            <textarea name="bio" placeholder="Enter your bio here..."></textarea>

            <br />
            <br />

            <button>Submit</button>

        </form>
    </body>
</html>
