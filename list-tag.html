<!DOCTYPE html>
<html>

<head>
    <title>List Tag</title>
    </hea>

<body>


    <center>
        <h1>TOP 3 LIVERPOOL PLAYERS</h1>
    </center>

    <!-- List Tag (List tags are of 2 types: Unordered List and Ordered List) -->

    <!-- Ordered List -->

    <ol>
        <li>Gakpo</li>
        <li>Payet</li>
        <li>Jacquet</li>
    </ol>

    <!-- Unordered List -->

    <ul>
        <li>Gakpo</li>
        <li>Payet</li>
        <li>Jacquet</li>
    </ul>

</body>

</html>
